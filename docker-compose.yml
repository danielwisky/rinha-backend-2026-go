services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "10MB"
    networks:
      - backend

  api1:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
      GOMEMLIMIT: "150MiB"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "170MB"
    networks:
      - backend

  api2:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
      GOMEMLIMIT: "150MiB"
    ulimits:
      memlock: -1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "170MB"
    networks:
      - backend

# Memory budget (IVF int8, 43MB on disk, mmap-shared):
# nginx:    10 MB
# api1:    170 MB → mmap'd index pages + go runtime + slack
# api2:    170 MB → same; physical RAM shared via kernel page cache
# Total:   350 MB ✓
#
# CPU budget (rebalanced — nginx was throttled under burst at 0.05).
# Sweet spot found by sweeping: 0.10→0.15→0.20→0.30; 0.20 wins.
# nginx:    0.20  ↑ from 0.05 (k6 ramp to 900 RPS saturates a single worker)
# api1:     0.40  ↓ from 0.475 (Search compute uses <0.1 CPU after IVF v2)
# api2:     0.40  ↓ from 0.475
# Total:    1.00 ✓
#
# memlock unlimited (ulimits) so unix.Mlock can pin the IVF mmap pages and
# prevent page eviction under RSS pressure.

networks:
  backend:
    driver: bridge
