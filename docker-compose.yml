services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"
    networks:
      - backend

  api1:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - backend

  api2:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - backend

# Memory budget (IVF int8, 43MB on disk, mmap-shared):
# nginx:    10 MB
# api1:    170 MB → mmap'd index pages + go runtime + slack
# api2:    170 MB → same; physical RAM shared via kernel page cache
# Total:   350 MB ✓
#
# CPU budget:
# nginx:    0.05
# api1:     0.475
# api2:     0.475
# Total:    1.00 ✓

networks:
  backend:
    driver: bridge
