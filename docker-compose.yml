version: "3.8"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "8MB"
    networks:
      - backend

  api1:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STORE_URL: http://store:9990
      RESOURCES_PATH: /app/resources
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "16MB"
    networks:
      - backend

  api2:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      STORE_URL: http://store:9990
      RESOURCES_PATH: /app/resources
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "16MB"
    networks:
      - backend

  store:
    build:
      context: .
      dockerfile: Dockerfile.store
    volumes:
      - ./resources/references.json.gz:/app/resources/references.json.gz:ro
    environment:
      REFS_PATH: /app/resources/references.json.gz
      EF_BUILD: "40"
      EF_SEARCH: "40"
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "310MB"
    networks:
      - backend

# Memory breakdown (float16 storage, label_lookup_ disabled):
# nginx:  12 MB
# api1:   20 MB
# api2:   20 MB
# store: 298 MB → hnswlib(216MB) + linkLists(24MB) + visited(6MB) + labels(3MB) + Go(15MB) + margin
# Total: 350 MB ✓

networks:
  backend:
    driver: bridge
