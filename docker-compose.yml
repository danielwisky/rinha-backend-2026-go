services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "8MB"
    networks:
      - backend

  api1:
    image: danielwisky/rinha-2026-api:v2
    platform: linux/amd64
    environment:
      STORE_URL: http://store:9990
      RESOURCES_PATH: /app/resources
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "16MB"
    networks:
      - backend

  api2:
    image: danielwisky/rinha-2026-api:v2
    platform: linux/amd64
    environment:
      STORE_URL: http://store:9990
      RESOURCES_PATH: /app/resources
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "16MB"
    networks:
      - backend

  store:
    image: danielwisky/rinha-2026-store:v3
    platform: linux/amd64
    environment:
      INDEX_PATH: /app/resources/index
      EF_SEARCH: "40"
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "310MB"
    networks:
      - backend

# Memory budget (int8 quantization, prebuilt index loaded from disk):
# nginx:   8 MB
# api1:   16 MB
# api2:   16 MB
# store: 310 MB → hnswlib(int8 vectors + graph) + labels + Go runtime + margin
# Total: 350 MB ✓

networks:
  backend:
    driver: bridge
