services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "8MB"
    networks:
      - backend

  api1:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      STORE_URL: unix:///run/store/store.sock
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - store-sock:/run/store
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "16MB"
    networks:
      - backend

  api2:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/amd64
    environment:
      STORE_URL: unix:///run/store/store.sock
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
    volumes:
      - store-sock:/run/store
    depends_on:
      - store
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "16MB"
    networks:
      - backend

  store:
    build:
      context: .
      dockerfile: Dockerfile.store
    platform: linux/amd64
    environment:
      INDEX_PATH: /app/resources/index
      EF_SEARCH: "40"
      GOMAXPROCS: "2"
      GOGC: "200"
      LISTEN_SOCKET: /run/store/store.sock
    volumes:
      - store-sock:/run/store
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "310MB"
    networks:
      - backend

# Memory budget (HNSW M=2 int8, store w/ label_lookup + locks cleared):
# nginx:    6 MB
# api1:    20 MB
# api2:    20 MB
# store:  304 MB  → hnswlib post-cleanup ~160MB resident + Go + slack
# Total:  350 MB ✓
#
# CPU budget:
# nginx:    0.05
# api1:     0.10
# api2:     0.10
# store:    0.75
# Total:    1.00 ✓

volumes:
  store-sock:

networks:
  backend:
    driver: bridge
