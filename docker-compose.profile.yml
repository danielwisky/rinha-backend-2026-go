services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.05"
          memory: "10MB"
    networks:
      - backend

  api1:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/arm64
    ports:
      - "6060:6060"
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
      GOMEMLIMIT: "150MiB"
      PPROF: "1"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - backend

  api2:
    build:
      context: .
      dockerfile: Dockerfile.api
    platform: linux/arm64
    environment:
      IVF_PATH: /app/resources/ivf.bin
      RESOURCES_PATH: /app/resources
      GOMAXPROCS: "1"
      GOGC: "200"
      GOMEMLIMIT: "150MiB"
    deploy:
      resources:
        limits:
          cpus: "0.475"
          memory: "170MB"
    networks:
      - backend

networks:
  backend:
    driver: bridge
