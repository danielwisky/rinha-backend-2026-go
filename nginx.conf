worker_processes 1;

events {
    worker_connections 4096;
    use epoll;
}

http {
    access_log off;
    keepalive_timeout 65;
    keepalive_requests 10000;

    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 100;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
