worker_processes 1;
worker_rlimit_nofile 8192;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    keepalive_timeout 75s;
    keepalive_requests 100000;

    upstream api {
        server api1:8080;
        server api2:8080;
        keepalive 256;
        keepalive_requests 100000;
    }

    server {
        listen 9999 backlog=4096;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
    }
}
